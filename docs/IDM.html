<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 IDM - Bandcamp Collection</title>

    <link rel="stylesheet" href="theme-palettes.css">
    <style>
        [data-theme="og"], :root:not([data-theme]) {
            --bg: #14141e;
            --surface: rgba(30, 30, 45, 0.95);
            --surface-2: #2d1b4e;
            --border: #667eea;
            --text: #e0e0e0;
            --text-muted: #b0b0b0;
            --accent: #9d7dff;
            --accent-2: #667eea;
            --success: #4CAF50;
            --warning: #f4a742;
            --danger: #f44336;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, var(--surface-2) 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: var(--surface);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: var(--text);
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1em;
            margin-bottom: 15px;
        }

        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #764ba2;
        }

        .reset-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-left: 20px;
            padding: 8px 16px;
            min-height: 44px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s;
        }

        .reset-btn:hover {
            background: #da190b;
            transform: translateY(-2px);
        }

        .stats {
            margin-top: 15px;
            padding: 15px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 10px;
            color: var(--text);
        }

        .embeds-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .embed-item {
            background: var(--surface);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            min-width: 0;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s, opacity 0.3s;
        }

        .embed-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .embed-item.hidden {
            display: none;
        }

        .embed-item.listened {
            opacity: 0;
            transform: scale(0.8);
            pointer-events: none;
        }

        .embed-item iframe,
        .embed-item embed {
            max-width: 100%;
        }

        .embed-info {
            margin-top: 15px;
            color: #c0c0c0;
            font-size: 0.9em;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        .embed-actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .action-btn {
            flex: 1;
            min-width: 150px;
            min-height: 44px;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9em;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .listened-btn {
            background: var(--success);
            color: white;
        }

        .listened-btn:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        .listened-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .page-btn {
            background: var(--surface);
            border: 2px solid var(--accent-2);
            color: var(--accent);
            padding: 10px 20px;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }

        .page-btn:hover {
            background: var(--accent-2);
            color: white;
        }

        .page-btn.active {
            background: var(--accent-2);
            color: white;
        }

        .page-btn:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .page-info {
            display: inline-flex;
            align-items: center;
            color: var(--text-muted);
            padding: 0 4px;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            background: white;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .notification.show {
            display: block;
        }

        .notification.success {
            border-left: 4px solid var(--success);
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .embeds-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2em;
                overflow-wrap: break-word;
            }

            .action-btn {
                min-width: 100%;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            header {
                padding: 20px;
            }

            h1 {
                font-size: 1.5em;
            }

            .embed-item {
                padding: 15px;
            }

            .reset-btn {
                margin-left: 0;
                margin-top: 10px;
            }

            .notification {
                left: 16px;
                right: 16px;
                max-width: calc(100% - 32px);
            }
        }
    </style>

l by The Loved\r\n Ones", "date": "Tue, 27 Oct 2026 16:01:12 +0000 (UTC)"}, {"id": "album_716628701", "embed": "<iframe style=\"border: 0; width: 400px; height: 120px;\" src=\"https://bandcamp.com/EmbeddedPlayer/album=716628701/size=large/bgcol=333333/linkcol=9a64ff/tracklist=false/artwork=small/transparent=true/\" seamless></iframe>", "subject": "New release from Batty Bass", "date": "Tue, 27 Oct 2026 15:46:02 +0000 (UTC)"}], "7": [{"id": "album_1164968770", "embed": "<iframe style=\"border: 0; width: 400px; height: 120px;\" src=\"https://bandcamp.com/EmbeddedPlayer/album=1164968770/size=large/bgcol=333333/linkcol=9a64ff/tracklist=false/artwork=small/transparent=true/\" seamless></iframe>", "subject": "New release from A Strangely Isolated Place", "date": "Mon, 26 Oct 2026 14:35:09 +0000 (UTC)"}]};
        const TOTAL_PAGES = 7;
        const MAX_PAGE_BUTTONS = 15;
        const STORAGE_KEY = 'bandcamp_listened_IDM';
        const TOTAL_ITEMS = 55;

        let currentPage = 1;
        let listenedItems = new Set();

        // Cargar estado guardado al iniciar (solo para ocultar, en esta
        // misma sesión sin recargar, lo que se acaba de marcar -- el
        // servidor ya excluye los escuchados de allPagesData en cada
        // regeneración, así que tras un reload esto ya no hace falta)
        function loadListenedState() {
            try {
                listenedItems = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));
            } catch (e) {
                listenedItems = new Set();
            }
            updateStats();
            console.log('💾 Loaded listened:', listenedItems.size);
        }

        function saveListenedState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(listenedItems)));
        }

        // Actualizar estadísticas
        function updateStats() {
            const pending = TOTAL_ITEMS - listenedItems.size;
            document.getElementById('listened-count').textContent = listenedItems.size;
            document.getElementById('pending-count').textContent = pending;
            document.getElementById('visible-count').textContent = pending;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderEmbedItem(item) {
            return `
        <div class="embed-item" id="${item.id}" data-embed-id="${item.id}">
            ${item.embed}
            <div class="embed-info">
                <strong>${escapeHtml(item.subject)}</strong><br>
                <small>📅 ${escapeHtml(item.date)}</small>
            </div>
            <div class="embed-actions">
                <button class="action-btn listened-btn" onclick="markAsListened('${item.id}')">
                    🎧 Marcar como escuchado
                </button>
            </div>
        </div>
            `;
        }

        function loadPage(pageNum) {
            if (pageNum < 1 || pageNum > TOTAL_PAGES) return;

            const container = document.getElementById('embeds-container');
            const pageItems = (allPagesData[String(pageNum)] || [])
                .filter(item => !listenedItems.has(item.id));

            container.innerHTML = pageItems.map(renderEmbedItem).join('');
            currentPage = pageNum;
            renderPagination();

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderPagination() {
            const html = createPaginationButtons();
            document.getElementById('pagination-top').innerHTML = html;
            document.getElementById('pagination-bottom').innerHTML = html;
        }

        function createPaginationButtons() {
            if (TOTAL_PAGES <= 1) return '';

            let html = '';
            html += currentPage > 1
                ? `<button class="page-btn" onclick="changePage(${currentPage - 1})">← Anterior</button>`
                : `<button class="page-btn" disabled>← Anterior</button>`;

            let startPage = Math.max(1, currentPage - Math.floor(MAX_PAGE_BUTTONS / 2));
            let endPage = Math.min(TOTAL_PAGES, startPage + MAX_PAGE_BUTTONS - 1);
            if (endPage - startPage < MAX_PAGE_BUTTONS - 1) {
                startPage = Math.max(1, endPage - MAX_PAGE_BUTTONS + 1);
            }

            if (startPage > 1) {
                html += `<button class="page-btn" onclick="changePage(1)">1</button>`;
                if (startPage > 2) html += `<span class="page-info">…</span>`;
            }
            for (let i = startPage; i <= endPage; i++) {
                html += i === currentPage
                    ? `<button class="page-btn active">${i}</button>`
                    : `<button class="page-btn" onclick="changePage(${i})">${i}</button>`;
            }
            if (endPage < TOTAL_PAGES) {
                if (endPage < TOTAL_PAGES - 1) html += `<span class="page-info">…</span>`;
                html += `<button class="page-btn" onclick="changePage(${TOTAL_PAGES})">${TOTAL_PAGES}</button>`;
            }

            html += currentPage < TOTAL_PAGES
                ? `<button class="page-btn" onclick="changePage(${currentPage + 1})">Siguiente →</button>`
                : `<button class="page-btn" disabled>Siguiente →</button>`;
            return html;
        }

        function changePage(pageNum) {
            if (pageNum >= 1 && pageNum <= TOTAL_PAGES) loadPage(pageNum);
        }

        // Marcar como escuchado (servidor — SQLite — es la fuente de verdad;
        // localStorage se mantiene solo para el feedback visual inmediato)
        function markAsListened(embedId) {
            listenedItems.add(embedId);
            saveListenedState();

            fetch('/api/listened', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({id: embedId}),
            }).catch(err => console.error('No se pudo guardar en el servidor:', err));

            // Quitar solo este elemento, no volver a renderizar la página
            // entera: container.innerHTML = ... destruiría y recrearía
            // TODOS los <iframe> de la página actual (recargándolos todos),
            // no solo el que se acaba de marcar.
            const element = document.getElementById(embedId);
            if (element) element.remove();

            updateStats();
            showNotification('¡Marcado como escuchado!', 'success');
        }

        // Resetear todos los escuchados de esta sesión/localStorage. Ojo:
        // no revierte lo ya confirmado en el servidor (bc_db no soporta
        // "desmarcar"), así que tras la próxima regeneración los que ya se
        // enviaron al servidor no volverán a aparecer.
        function resetListened() {
            if (!confirm('¿Restaurar todos los discos? Aparecerán de nuevo los que marcaste como escuchados.')) {
                return;
            }
            listenedItems.clear();
            saveListenedState();
            updateStats();
            loadPage(currentPage);
            showNotification('Todos los discos restaurados', 'success');
        }

        // Notificaciones
        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification show ${type}`;

            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        console.log('🔑 Usando album_id/track_id de Bandcamp como identificador único');
        console.log('💾 Storage key:', STORAGE_KEY);

        // Función para detener otros reproductores de Bandcamp
        function stopOtherPlayers(currentIframe) {
            const allIframes = document.querySelectorAll('iframe[src*="bandcamp.com"]');
            allIframes.forEach(iframe => {
                if (iframe !== currentIframe) {
                    const src = iframe.src;
                    iframe.src = '';
                    iframe.src = src;
                }
            });
        }

        // Detectar cuando se reproduce un embed -- delegado en el contenedor
        // (no en cada .embed-item) porque loadPage() los crea/destruye en
        // cada cambio de página, así que un listener por item se perdería.
        document.getElementById('embeds-container').addEventListener('click', (e) => {
            const embedItem = e.target.closest('.embed-item');
            if (!embedItem) return;
            const iframe = embedItem.querySelector('iframe[src*="bandcamp.com"]');
            if (iframe && !e.target.classList.contains('action-btn')) {
                setTimeout(() => {
                    stopOtherPlayers(iframe);
                }, 100);
            }
        });

        loadListenedState();
        loadPage(1);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                changePage(currentPage - 1);
            } else if (e.key === 'ArrowRight') {
                changePage(currentPage + 1);
            }
        });
    </script>
    <script src="theme-picker.js"></script>
