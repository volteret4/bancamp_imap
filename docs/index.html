<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Mi Colección de Bandcamp</title>
    <link rel="stylesheet" href="theme-palettes.css">
    <style>
        [data-theme="og"], :root:not([data-theme]) {
            --bg: #14141e;
            --surface: rgba(30, 30, 45, 0.95);
            --surface-2: #2d1b4e;
            --border: #667eea;
            --text: #e0e0e0;
            --text-muted: #b0b0b0;
            --accent: #9d7dff;
            --accent-2: #667eea;
            --success: #4CAF50;
            --warning: #f4a742;
            --danger: #f44336;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, var(--surface-2) 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: var(--surface);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            color: var(--text);
            font-size: 3em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.2em;
        }

        .genres-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .genre-card {
            background: var(--surface);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            min-width: 0;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .genre-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .genre-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .genre-card h2 {
            color: var(--accent);
            margin-bottom: 10px;
            font-size: 1.5em;
            overflow-wrap: break-word;
        }

        .count {
            color: var(--text-muted);
            font-size: 1.1em;
        }

        .tools-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            padding: 12px 24px;
            min-height: 44px;
            background: linear-gradient(135deg, #9d7dff 0%, #7c5ce0 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(157, 125, 255, 0.3);
        }

        .tools-link:hover {
            background: linear-gradient(135deg, #b99dff 0%, #9d7dff 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(157, 125, 255, 0.4);
        }

        footer {
            margin-top: 40px;
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
                overflow-wrap: break-word;
            }

            .genres-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            header {
                padding: 20px;
            }

            h1 {
                font-size: 1.5em;
            }

            .genre-card {
                padding: 20px;
            }

            .tools-link {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎵 Mi Colección de Bandcamp</h1>
            <p class="subtitle">💿 1 álbumes en 1 género</p>
            <div style="margin-top: 20px;">
                <a href="sync_tools.html" class="tools-link">🔧 Sincronizar Colección</a>
            </div>
        </header>

        <div class="genres-grid">
            
        <div class="genre-card">
            <a href="MustHave_Sellos.html" class="genre-link">
                <h2>🎵 MustHave Sellos</h2>
                <p class="count">💿 1 disco</p>
            </a>
        </div>
        
        </div>

        <footer>
            <p>Generado con 💜 para disfrutar la música</p>
            <p style="margin-top: 10px; font-size: 0.85em;">
                Usando album_id de Bandcamp como identificador único
            </p>
        </footer>
    </div>
    <script src="theme-picker.js"></script>
</body>
</html>
