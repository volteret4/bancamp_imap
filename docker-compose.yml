# Instalación por separado. Dentro de REPEAT-ONE se usa el docker-compose.yml de REPEAT-ONE.
services:
  bandcamp:
    build: .
    restart: unless-stopped
    user: "${UID_GID:-1000:1000}"
    env_file:
      - path: .env
        required: false
    environment:
      - HOME=/tmp
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - .:/app
    ports:
      - "${PUERTO:-8765}:8765"
    labels:
      ofelia.enabled: "true"
      repeat-one.ofelia: "bancamp_imap"
      ofelia.job-exec.bandcamp-update.schedule: "0 45 5 * * *"
      ofelia.job-exec.bandcamp-update.command: "nice -n 19 ionice -c 3 bash update.sh"
      ofelia.job-exec.bandcamp-publish.schedule: "0 55 5 * * *"
      ofelia.job-exec.bandcamp-publish.command: "nice -n 19 ionice -c 3 bash publish_docs.sh"

  # Ofelia lanza los trabajos programados de las etiquetas ofelia.job-exec.* de arriba
  # (los mismos horarios que en REPEAT-ONE). Solo ve los contenedores de este repo.
  # Si no quieres actualizaciones automáticas: docker compose stop ofelia
  ofelia:
    image: mcuadros/ofelia:latest
    restart: unless-stopped
    command: daemon --docker --docker-filter=label=repeat-one.ofelia=bancamp_imap
    environment:
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - bandcamp
