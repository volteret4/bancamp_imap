## Config para SWAG (linuxserver/swag)
## Guardar en: /path/to/swag/config/nginx/proxy-confs/bandcamp.subdomain.conf
## Asegúrate de tener un CNAME/A record apuntando a tu servidor.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name bandcamp.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;

        # IP del host desde dentro del contenedor Docker
        # Opciones comunes: 172.17.0.1  |  host-gateway  |  host.docker.internal
        set $upstream_app  172.17.0.1;
        set $upstream_port 8765;
        set $upstream_proto http;

        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
